# Credentials for the upstream proxy. The ConfigMap's header
#   Proxy-Authorization: Basic $ENCODED_PW
# reads ENCODED_PW from the environment; the Deployment sets it from this
# Secret. Value: base64 of "user:password", e.g.
#   printf '%s' 'user:password' | base64
# Create it from the command line instead of committing a real value:
#   oc create secret generic tpt-proxy-auth --from-literal=encoded_pw="$(printf '%s' 'user:password' | base64)"
apiVersion: v1
kind: Secret
metadata:
  name: tpt-proxy-auth
type: Opaque
stringData:
  encoded_pw: "dXNlcjpwYXNzd29yZA=="   # placeholder: base64("user:password")
