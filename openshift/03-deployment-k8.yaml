apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"upstream-connector:1.0"},"fieldPath":"spec.template.spec.containers[?(@.name==\"upstream-connector\")].image"}]'
    openshift.io/generated-by: OpenShiftNewApp
  creationTimestamp: null
  labels:
    app: up-connector
    app.kubernetes.io/component: up-connector
    app.kubernetes.io/instance: up-connector
  name: up-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: up-connector
  strategy: {}
  template:
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftNewApp
      creationTimestamp: null
      labels:
        deployment: up-connector
    spec:
      containers:
      - image: 'ghcr.io/git001/tls-proxy-tunnel:4.0.0'
        name: up-connector
        imagePullPolicy: IfNotPresent
        env:
        - name: TPT_CONFIG
          value: /etc/tpt/config.yaml
        - name: RUST_LOG
          value: info
        # Proxy-Authorization: Basic $ENCODED_PW in the ConfigMap
        - name: ENCODED_PW
          valueFrom:
            secretKeyRef:
              name: tpt-proxy-auth
              key: encoded_pw
        ports:
        - name: up-connector
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 1
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 1
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 1
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        # Measured (release build): ~12 MiB idle, plus ~55 KiB per concurrent
        # connection, plus kernel socket buffers (charged to the container
        # under cgroup v2, grow with throughput). Raise the memory limit with
        # maxclients. No CPU limit: CFS throttling adds latency to every
        # relayed connection; the request alone reserves the share.
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        # tpt needs no privileges: any (random) UID, no capabilities, no
        # privilege escalation, listen ports above 1024. Fits the OpenShift
        # restricted-v2 SCC and the Kubernetes "restricted" Pod Security level.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true       # tpt writes no files
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: tpt-config
            mountPath: /etc/tpt/config.yaml
            subPath: config.yaml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      # tpt's shutdown_timeout (default 25s) ends the drain before this.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tpt-config
          configMap:
            name: tpt-config
            defaultMode: 420
status: {}
