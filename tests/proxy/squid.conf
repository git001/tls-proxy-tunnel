# squid for tests/proxy/squid.sh, on the host network. Requests from this
# host only, to any port (a default squid.conf allows CONNECT to 443 only).
# No cache; the access log goes to stdout (podman logs).
#
# Three ports:
#   @TUNNEL_PORT@  plain proxy: CONNECT opens a tunnel, TLS runs between
#                  the client and the backend through tpt.
#   @AUTH_PORT@    like the tunnel, but requires Basic auth (passwd file).
#   @BUMP_PORT@    man in the middle, like a corporate proxy: squid ends the
#                  client's TLS with a certificate signed by its own CA
#                  (mitm-ca.crt) and opens its own TLS session to the
#                  backend, verified with the test CA (ca.crt).
#
# squid.sh replaces the ports; /etc/squid/test is its work directory.
http_port 127.0.0.1:@TUNNEL_PORT@ name=tunnel
http_port 127.0.0.1:@AUTH_PORT@ name=auth
http_port 127.0.0.1:@BUMP_PORT@ name=bump ssl-bump tls-cert=/etc/squid/test/mitm-ca.crt tls-key=/etc/squid/test/mitm-ca.key generate-host-certificates=on

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/test/passwd
auth_param basic realm tpt-test
acl authport myportname auth
acl authed proxy_auth REQUIRED

# Look at the client's and then the backend's hello before bumping, so the
# certificate squid makes copies the backend's names.
acl step1 at_step SslBump1
acl step2 at_step SslBump2
ssl_bump peek step1
ssl_bump stare step2
ssl_bump bump all
tls_outgoing_options cafile=/etc/squid/test/ca.crt
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 4MB
sslcrtd_children 2

http_access deny authport !authed
http_access allow localhost
http_access deny all
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
pid_filename none
shutdown_lifetime 0 seconds
